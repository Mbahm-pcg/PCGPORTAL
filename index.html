<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:clamp(13px, 1.1vw, 22px);}
  body{font-family:'Source Sans 3',sans-serif; font-size:1rem;}
  input,textarea,select{font-family:'Source Sans 3',sans-serif;}
  ::-webkit-scrollbar{width:12px;height:12px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#FF671F55;border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:#FF671Faa;border:2px solid transparent;background-clip:padding-box;}
  *{scrollbar-width:auto;scrollbar-color:#FF671F55 transparent;}
  .fade-in{animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  /* Contain Leaflet's internal stacking (panes ~400, controls ~1000) inside a
     z-index:0 context so the map never renders above the sidebar drawer (z:200),
     notification/chat popups, or modals on mobile. */
  .leaflet-container{position:relative;z-index:0;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.92)}}
  @keyframes navDotPing{0%{transform:scale(1);opacity:1}70%,100%{transform:scale(2.2);opacity:0}}
  @keyframes loginMeshShift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
  @keyframes loginFloatUp{0%{transform:translateY(110vh) translateX(0) scale(0.6);opacity:0}10%{opacity:.7}90%{opacity:.7}100%{transform:translateY(-15vh) translateX(40px) scale(1.1);opacity:0}}
  @keyframes loginShake{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-6px)}20%,40%,60%,80%{transform:translateX(6px)}}
  @keyframes loginPulseRing{0%{transform:scale(1);opacity:.8}70%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
  @keyframes loginFadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes heroShimmer{0%{background-position:0% 50%}100%{background-position:100% 50%}}
  .grad-name{background-size:220% auto;animation:heroShimmer 4.5s ease-in-out infinite alternate;}
  @media (prefers-reduced-motion:reduce){.grad-name{animation:none;}}
  @keyframes loginGradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes loginAuroraSpin{0%{transform:rotate(0deg) scale(1.1)}100%{transform:rotate(-360deg) scale(1.1)}}
  @keyframes loginDotDrift{0%{background-position:0 0}100%{background-position:28px 28px}}
  .login-enter{animation:loginFadeInUp .7s cubic-bezier(.25,.46,.45,.94) both;}
  .login-input-wrap:focus-within label{transform:translateY(-11px) scale(.72);color:#FF671F;letter-spacing:1.2px;opacity:1;}
  .login-input-wrap input:not(:placeholder-shown)+label{transform:translateY(-11px) scale(.72);letter-spacing:1.2px;opacity:0.7;}
  .login-input-wrap input:-webkit-autofill+label{transform:translateY(-11px) scale(.72);letter-spacing:1.2px;opacity:0.7;}
  .login-shake{animation:loginShake .5s cubic-bezier(.36,.07,.19,.97) both;}
  .google-btn-wrap{transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease;}
  .google-btn-wrap:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,0.22),0 4px 8px rgba(0,0,0,0.14);}
  .google-btn-wrap:active{transform:translateY(-1px);box-shadow:0 5px 12px rgba(0,0,0,0.18);}
  @keyframes loginExitZoom{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
  .login-exit{animation:loginExitZoom .65s cubic-bezier(.4,0,.2,1) both;}
  @keyframes dashEnter{0%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
  .dash-enter{animation:dashEnter .5s cubic-bezier(.25,.46,.45,.94) both;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}}
  .theme-toggle-btn:hover{transform:scale(1.05);}
  .theme-toggle-btn{transition:all .2s ease;}

  @keyframes rippleExpand {
    from { clip-path: circle(0% at var(--rx) var(--ry)); opacity: 1; }
    to   { clip-path: circle(180% at var(--rx) var(--ry)); opacity: 1; }
  }
  @keyframes logoGlow {
    0%   { filter: drop-shadow(0 0 0px #FFD700) brightness(1); }
    30%  { filter: drop-shadow(0 0 28px #FFD700) drop-shadow(0 0 60px #FF671F) brightness(1.3); }
    60%  { filter: drop-shadow(0 0 14px #FFD70088) brightness(1.15); }
    100% { filter: drop-shadow(0 0 0px #FFD700) brightness(1); }
  }
  @keyframes logoSpin {
    0%   { transform: scale(1) rotate(0deg); }
    25%  { transform: scale(1.12) rotate(-6deg); }
    50%  { transform: scale(1.18) rotate(4deg); }
    75%  { transform: scale(1.1) rotate(-2deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); }
  }
  .logo-transitioning {
    animation: logoGlow 0.7s ease-out, logoSpin 0.7s ease-out;
  }
  .theme-ripple {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    animation: rippleExpand 0.65s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  .particle {
    position: fixed; width: 6px; height: 6px; border-radius: 50%;
    background: #FFD700; pointer-events: none; z-index: 10000;
    animation: particleFly 0.6s ease-out forwards;
  }

  /* Sidebar drawer transition */
  .sidebar-drawer {
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), background 0.3s, border 0.3s;
  }
  .sidebar-overlay {
    position: fixed; inset: 0; background: #00000060; z-index: 199;
    animation: fadeIn .2s ease;
  }

  /* Sidebar nav — scrolls only when an expanded section overflows the viewport;
     kept thin/subtle so it never reads as a dominant scrollbar. */
  .sidebar-nav-scroll { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .sidebar-nav-scroll:hover { scrollbar-color: rgba(128,128,128,0.4) transparent; }
  .sidebar-nav-scroll::-webkit-scrollbar { width: 5px; }
  .sidebar-nav-scroll::-webkit-scrollbar-track { background: transparent; }
  .sidebar-nav-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
  .sidebar-nav-scroll:hover::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.4); }

  /* Responsive breakpoints */
  @media (max-width: 768px) {
    html { font-size: 14px !important; }
    body, #root { font-size: 1rem !important; }
    .desktop-sidebar { display: none !important; }
    .mobile-topbar-padding { padding: 12px 16px !important; }
    .main-content-padding { padding: 20px 16px !important; }
    .links-grid { grid-template-columns: 1fr 1fr !important; }
    .add-link-grid { grid-template-columns: 1fr !important; }
    .search-row { flex-wrap: wrap; }
    .search-row input { max-width: 100% !important; width: 100% !important; }
    .notes-grid { grid-template-columns: 1fr !important; }
    .hide-mobile { display: none !important; }
  }
  @media (max-width: 480px) {
    .links-grid { grid-template-columns: 1fr !important; }
  }
  @media (min-width: 769px) {
    .mobile-only { display: none !important; }
    .bottom-nav { display: none !important; }
  }
  /* Bottom nav scroll — hide scrollbar but keep scrollable */
  .bottom-nav { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .bottom-nav::-webkit-scrollbar { display: none; }
  /* Chat message delete button — show on hover */
  div:hover > .msg-del-btn { display: flex !important; }
  /* Sidebar pin toggle — hidden until row hover; stays lit when pinned */
  .nav-pin { opacity: 0; transition: opacity .15s, transform .15s; cursor: pointer; }
  .nav-row:hover .nav-pin { opacity: 0.7; }
  .nav-pin.pinned { opacity: 0.95; }
  .nav-pin:hover { opacity: 1 !important; transform: scale(1.18); }
  /* Card hover lift */
  .card-hover{transition:all .2s cubic-bezier(.4,0,.2,1);}
  .card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.15);}

  /* Toast slide animations */
  @keyframes toastSlideIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastSlideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:translateY(0)}}
  @media (max-width: 768px) {
    .orion-fab-btn { bottom: 80px !important; }
    .orion-panel { bottom: 148px !important; max-height: calc(100vh - 178px) !important; }
  }

  /* v23.7 Admin · Notifications: grouped list picker. */
  .nf-card{padding:1.5rem}
  .nf-groups{display:grid;gap:.9rem;margin-bottom:1.25rem}
  .nf-group-title{font-size:.72rem;font-weight:700;letter-spacing:.04em;margin-bottom:.4rem;font-family:'Source Sans 3',sans-serif}
  .nf-chips{display:flex;flex-wrap:wrap;gap:.45rem}
  .nf-chip{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .95rem;border-radius:999px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:'Source Sans 3',sans-serif;white-space:nowrap;flex-shrink:0}
  .nf-chip:focus-visible{outline:2px solid #FF671F;outline-offset:2px}
  @media (max-width:640px){
    .nf-card{padding:1rem .9rem}
    .nf-groups{gap:.7rem}
    /* one swipeable row per group, bleeding to the card edges */
    .nf-chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -.9rem;padding:0 .9rem 2px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .nf-chips::-webkit-scrollbar{display:none}
    .nf-chip{scroll-snap-align:start;padding:.45rem .85rem;font-size:.82rem}
    .nf-row{gap:.6rem !important}
    .nf-tag{display:none !important}
  }
  /* v23.8 Admin · Notifications on phones: categories → lists (user's mock). */
  .nf-card-bare{padding:0 !important;background:none !important;border:none !important;box-shadow:none !important}
  .nfm{display:grid;gap:.8rem}
  .nfm-search{display:flex;align-items:center;gap:.6rem;border:1px solid;border-radius:14px;padding:.75rem .95rem}
  .nfm-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:.95rem}
  .nfm-list{display:grid;gap:.7rem}
  .nfm-cat{border:1px solid;border-radius:16px;overflow:hidden}
  .nfm-cat-head{display:flex;align-items:center;gap:.8rem;width:100%;padding:1rem;background:none;border:none;cursor:pointer;font:inherit;text-align:left}
  .nfm-cat-ico{display:flex;width:26px;justify-content:center}
  .nfm-cat-title{flex:1;min-width:0;font-family:'Raleway',sans-serif;font-weight:700;font-size:1rem}
  .nfm-badge{min-width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
  .nfm-chev{display:flex;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .nfm-rows{display:grid;gap:2px;padding:0 .5rem .6rem}
  .nfm-row{display:flex;align-items:center;gap:.8rem;width:100%;padding:.8rem .7rem;border:none;border-radius:12px;cursor:pointer;font:inherit;font-size:.98rem;text-align:left}
  .nfm-row-ico{display:flex;width:26px;justify-content:center}
  .nfm-row-label{font-weight:600}
  .nfm-hint{display:flex;gap:.7rem;align-items:flex-start;border-radius:14px;padding:.9rem 1rem;font-size:.86rem;line-height:1.45}
  .nfm-back{display:flex;align-items:center;gap:.7rem;width:100%;border:1px solid;border-radius:14px;padding:.75rem .95rem;margin-bottom:1rem;font:inherit;font-size:.95rem;cursor:pointer;text-align:left}
  .nfm-cat-head:focus-visible,.nfm-row:focus-visible,.nfm-back:focus-visible{outline:2px solid #FF671F;outline-offset:-2px}
  @media (prefers-reduced-motion: no-preference){ .nfm-rows{animation:pcgFade .2s ease both} .nfm-rows > *{animation:pcgRise .32s cubic-bezier(.16,1,.3,1) both} .nfm-rows > :nth-child(2){animation-delay:35ms} .nfm-rows > :nth-child(3){animation-delay:70ms} .nfm-rows > :nth-child(4){animation-delay:105ms} .nfm-rows > :nth-child(5){animation-delay:140ms} .nfm-rows > :nth-child(n+6){animation-delay:175ms} }
  /* v23.4 app-style motion. Screen changes: only the content area (pcg-page) moves; the rest of
     the page (sidebar, top bar) gets a quick cross-fade. Forward = in from the right, back = in
     from the left. Skipped entirely for "reduce motion" and in browsers without View Transitions. */
  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .16s; }
    ::view-transition-group(pcg-page) { animation-duration: 0s; }
    ::view-transition-old(pcg-page) { animation: pcgOutFwd .22s cubic-bezier(.4,0,1,1) both; }
    ::view-transition-new(pcg-page) { animation: pcgInFwd .34s cubic-bezier(.2,.8,.2,1) both; }
    html[data-nav-dir="back"]::view-transition-old(pcg-page) { animation-name: pcgOutBack; }
    html[data-nav-dir="back"]::view-transition-new(pcg-page) { animation-name: pcgInBack; }
    @keyframes pcgInFwd  { from { opacity: 0; transform: translateX(32px) scale(.992); } to { opacity: 1; transform: none; } }
    @keyframes pcgOutFwd { to   { opacity: 0; transform: translateX(-18px) scale(.992); } }
    @keyframes pcgInBack { from { opacity: 0; transform: translateX(-32px) scale(.992); } to { opacity: 1; transform: none; } }
    @keyframes pcgOutBack{ to   { opacity: 0; transform: translateX(18px) scale(.992); } }
    @media (max-width: 768px) {
      @keyframes pcgInFwd  { from { opacity: 0; transform: translateX(56px); } to { opacity: 1; transform: none; } }
      @keyframes pcgInBack { from { opacity: 0; transform: translateX(-56px); } to { opacity: 1; transform: none; } }
    }
    /* v23.5 phones. Leaving / returning to a phone home slides the whole screen (iOS push / pop). */
    html[data-nav-shell]::view-transition-old(root) { animation: pcgOutFwd .26s cubic-bezier(.4,0,1,1) both; }
    html[data-nav-shell]::view-transition-new(root) { animation: pcgInFwd .38s cubic-bezier(.2,.8,.2,1) both; }
    html[data-nav-shell][data-nav-dir="back"]::view-transition-old(root) { animation-name: pcgOutBack; }
    html[data-nav-shell][data-nav-dir="back"]::view-transition-new(root) { animation-name: pcgInBack; }
    /* Bottom tabs in the phone homes: the old tab fades out fast; the new tab's cards then cascade in. */
    html[data-nav-dir="tab"]::view-transition-old(root) { animation: pcgTabOut .12s ease-in both; }
    html[data-nav-dir="tab"]::view-transition-new(root) { animation: pcgFade .16s ease both; }
    /* v23.6 cascade: a screen's cards rise in one after another (55 ms apart, ~0.45 s each; the
       9th card on all start together so long lists never feel slow). */
    .pcg-stagger > *, .pcg-stagger-2 > * > * { animation: pcgRise .46s cubic-bezier(.16,1,.3,1) both; animation-delay: 440ms; }
    .pcg-stagger > :nth-child(1), .pcg-stagger-2 > * > :nth-child(1) { animation-delay: 0ms; }
    .pcg-stagger > :nth-child(2), .pcg-stagger-2 > * > :nth-child(2) { animation-delay: 55ms; }
    .pcg-stagger > :nth-child(3), .pcg-stagger-2 > * > :nth-child(3) { animation-delay: 110ms; }
    .pcg-stagger > :nth-child(4), .pcg-stagger-2 > * > :nth-child(4) { animation-delay: 165ms; }
    .pcg-stagger > :nth-child(5), .pcg-stagger-2 > * > :nth-child(5) { animation-delay: 220ms; }
    .pcg-stagger > :nth-child(6), .pcg-stagger-2 > * > :nth-child(6) { animation-delay: 275ms; }
    .pcg-stagger > :nth-child(7), .pcg-stagger-2 > * > :nth-child(7) { animation-delay: 330ms; }
    .pcg-stagger > :nth-child(8), .pcg-stagger-2 > * > :nth-child(8) { animation-delay: 385ms; }
    .pcg-stagger > :nth-child(9), .pcg-stagger-2 > * > :nth-child(9) { animation-delay: 440ms; }
    @keyframes pcgRise { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes pcgTabOut { to { opacity: 0; } }
    @keyframes pcgTabIn  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    /* Sheets slide up with a soft spring; menus pop from their button; backdrops fade. */
    .pcg-sheet    { animation: pcgSheetUp .42s cubic-bezier(.16,1,.3,1) both; }
    .pcg-backdrop { animation: pcgFade .25s ease both; }
    .pcg-pop      { animation: pcgPop .2s cubic-bezier(.2,.8,.2,1) both; transform-origin: top right; }
    @keyframes pcgSheetUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes pcgFade    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pcgPop     { from { opacity: 0; transform: scale(.92) translateY(-4px); } to { opacity: 1; transform: none; } }
    /* Tap feedback on touch screens: buttons and tiles press in slightly. Buttons that set their
       own transform inline keep it (inline styles win). */
    @media (hover: none) and (pointer: coarse) {
      button, [role="button"], .fin-btn { transition: transform .16s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
      button:active, [role="button"]:active, .fin-btn:active { transform: scale(.965); transition-duration: .06s; }
    }
  }
</style>
